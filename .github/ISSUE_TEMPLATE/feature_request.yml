name: Feature request
description: Suggest an idea for the protocol or the tooling
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. Report those privately
        through the channel described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including what happens if nothing changes.
